<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up - CAMPULSE</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="images/f2-removebg-preview.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style2.css">
</head>

<body class="auth-page-body">

    <!-- Global Navigation matching homepage -->
    <nav>
        <a href="index.html" class="nav-brand">
            <img src="images/f6 - Copy.jpeg" alt="CAMPULSE Logo" class="nav-logo">
        </a>
        <ul>
            <li><a href="index.html#home">Home</a></li>
            <li><a href="upcoming-events.html">Events</a></li>
            <li><a href="student-login.html">Login</a></li>
        </ul>
    </nav>

    <!-- Main Signup Form Layout -->
    <main class="auth-container">
        <div class="auth-card">
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Join CAMPULSE to register and track NMIMS events.</p>

            <!-- Status Banner for JS Feedback -->
            <div id="status-banner" class="status-banner" style="display: none;"></div>

            <form id="signup-form" novalidate>
                <!-- Student ID -->
                <div class="form-group">
                    <label for="student-id">Student ID / SAP ID</label>
                    <input type="text" id="student-id" placeholder="e.g. 70012022001" required>
                    <small class="error-msg"></small>
                </div>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="student-name">Full Name</label>
                    <input type="text" id="student-name" placeholder="John Doe" required>
                    <small class="error-msg"></small>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="student-email">NMIMS Email Address</label>
                    <input type="email" id="student-email" placeholder="name@nmims.edu.in" required>
                    <small class="error-msg"></small>
                </div>

                <!-- Department Dropdown -->
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="Computer Engineering">Computer Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Data Science">Data Science</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="MBA Tech">MBA Tech</option>
                    </select>
                    <small class="error-msg"></small>
                </div>

                <!-- Year Dropdown -->
                <div class="form-group">
                    <label for="year">Year of Study</label>
                    <select id="year" required>
                        <option value="">Select Year</option>
                        <option value="First Year">First Year (FY)</option>
                        <option value="Second Year">Second Year (SY)</option>
                        <option value="Third Year">Third Year (TY)</option>
                        <option value="Final Year">Final Year (Final Year)</option>
                    </select>
                    <small class="error-msg"></small>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="10-digit mobile number" required>
                    <small class="error-msg"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                    <small class="error-msg"></small>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="auth-submit-btn">Create Account</button>

                <!-- Footer Link -->
                <p class="auth-footer-text">
                    Already registered? <a href="student-login.html">Login here</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Global Footer matching homepage -->
    <footer>
        <p>&copy; 2026 CAMPULSE | NMIMS Event Platform</p>
    </footer>

    <script src="js/signup.js"></script>
</body>

</html>
